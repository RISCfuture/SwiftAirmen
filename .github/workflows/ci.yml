# CI Matrix Policy
#
# SwiftAirmen declares tools-version 6.4 and a macOS 27 / iOS 27 / tvOS 27 /
# watchOS 27 / visionOS 27 floor, because Foundation's `ProgressManager`
# (SF-0023) carries no lower availability annotation.
#
# Darwin: the macOS 27 SDK is only on GitHub's `xcode-27` image (there is no
# `macos-27` label), and that image is selected with `maxim-lobanov/setup-xcode`
# rather than `SwiftyLab/setup-swift`. `macos-15` and `macos-26` cannot supply a
# macOS 27 SDK at all, so those legs are gone.
#
# Linux: `ProgressManager` is `@available(FoundationPreview 6.4)` in
# swift-foundation, so it does not exist on the 6.3 toolchain. Only the Swift 6.4
# Linux leg can build this package.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests-darwin:
    name: Build and Test (macOS)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-test-xcode-27-${{ hashFiles('Package.resolved') }}
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v
  tests-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.4"
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: swiftpm-test-ubuntu-latest-swift6.4-${{ hashFiles('Package.resolved') }}
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.4"
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-docs-ubuntu-latest-swift6.4-${{ hashFiles('Package.resolved') }}
      - name: Build documentation
        run: |
          swift package \
           --allow-writing-to-directory "$RUNNER_TEMP/docs" \
           generate-documentation --target SwiftAirmen --output-path "$RUNNER_TEMP/docs" \
           --warnings-as-errors
  lint:
    name: Run SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v6
      - name: Run SwiftLint
        run: swiftlint --strict
  swift-format:
    name: Run swift-format
    runs-on: ubuntu-latest
    container:
      image: swift:latest
    steps:
      - uses: actions/checkout@v6
      - name: Download .swift-format config
        run: |
          apt-get update && apt-get install -y wget
          wget -O .swift-format https://gist.githubusercontent.com/RISCfuture/e0c21afb7bd80a88d128a42bf40d2ecd/raw/.swift-format
      - name: Run swift-format lint
        run: swift format lint --strict -r .
